<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <meta name="author" content="Andrianarivo Andy">
    <title>Form assignment</title>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset id="information">
                <legend>Contact Information</legend>


                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>


                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

            </fieldset>

            <fieldset id="questions">

                <legend>Questions</legend>

                <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="safari">Safari</option>
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="opera">Opera</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-item column1">
                    <label for="pet">Do you have an household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item text">
                    <label for="feedback">List of places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="5"
                      placeholder="Antananarivo Madagascar, Salt Lake City Utah USA, Camberra Australia, Paris France, ..."></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        &copy; 2026 | HTML Form - User Poll Activity | Andrianarivo Andy
    </footer>
</body>

</html>
