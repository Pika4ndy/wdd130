<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Quiz</title>
</head>

<body>
    <header>
        <h1>Quiz on HTML</h1>
    </header>
    <main>
        <form>
            <div>
                <label for="q1">What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" autocapitalize="">
            </div>

            <div>
                <label for="q2">Enter the 3 first main HTML tag (separate by commas)</label>
                <textarea name="q2" id="q2" placeholder="Enter your answer here..."></textarea>
            </div>

            <div>
                <label for="q3">Which of these is not a valid HTML tag?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="code">&lt;code&gt;</option>
                    <option value="note">&lt;note&gt;</option>
                    <option value="span">&lt;span&gt;</option>
                </select>
            </div>

            <div>
                <label for="q4">How many identical idea can be used inside the same HTML source
                    code?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
