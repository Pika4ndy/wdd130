<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rapids! White Water Rafting Company Homepage">
    <meta name="author" content="Andrianarivo Andy Mahery Christiano">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Rapids! Homepage</title>
</head>

<body>
    <header>
        <a href="index.html"><img src="images/wwr-logo.jpeg" alt="Whitewater Rafting Logo"></a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>Welcome to Rapids!</h1>
            <img src="images/home_hero.png"
              alt="Hero image, several people rafting on a green river with white waves beneath">
        </div>
        <section>
            <h2>Subscribe to our newsletter!</h2>
            <form class="subscription-form">
                <div class="form-item">
                    <label for="fullname" aria-required="true">Full Name</label>
                    <input type="text" name="fullname" id="fullname" required>
                </div>
                <div class="form-item">
                    <label for="email" aria-required="true">Email</label>
                    <input type="email" name="fullname" id="fullname" required>
                </div>
                <div class="">

                </div>

                <div class="newsletter-button"><button type="submit">Subscribe to
                        newsletter!</button></div>
            </form>
        </section>
        <section class="call-to-action">
            <a href="trips.html">
                <img src="images/large-rafting-image.jpg"
                  alt="people rafting on a light river next to big black rocks">
            </a>
            <a href="trips.html" class="text-link">Come and Visit our trips!</a>
        </section>
    </main>
    <footer>
        <p>
            &copy; 2026 🌊 Rapids 🌊 Andrianarivo Andy
        </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
